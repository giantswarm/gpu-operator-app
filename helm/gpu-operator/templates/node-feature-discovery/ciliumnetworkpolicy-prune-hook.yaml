{{- /*
Node Feature Discovery's subchart uninstalls with a post-delete hook (`postDeleteCleanup`): a Job
running `nfd-master -prune` that takes the NFD-managed labels, annotations and extended resources
off the nodes. Helm runs the hooks of an uninstall after the release's objects are gone,
`allow-node-feature-discovery-talk-to-apiserver` included, so on a cluster with a default-deny
network policy the prune pod could not reach the API server and the hook failed. This policy is a
post-delete hook as well: a lower weight than the Job's (which has none, so 0) creates it first,
and it is deleted together with the Job once the hook succeeded.
*/ -}}
{{- if (index .Values "gpu-operator" "node-feature-discovery").postDeleteCleanup }}
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-node-feature-discovery-prune-talk-to-apiserver
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: "node-feature-discovery"
    {{- include "gpu-operator.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-delete
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: node-feature-discovery
      role: prune
  egress:
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: "443"
        protocol: TCP
      - port: "6443"
        protocol: TCP
{{- end }}
