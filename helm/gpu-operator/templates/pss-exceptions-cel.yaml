{{- if and .Values.global.podSecurityStandards.enforced .Values.kyvernoPolicyExceptions.enabled }}
{{/*
The NVIDIA GPU Operator cannot satisfy it: the upstream chart sets no
securityContext on its own Deployment or on the pre-upgrade CRD Job, and exposes no
values to add one, while the DaemonSets the operator creates at runtime need host
access to talk to the driver.
*/}}
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: gpu-operator-exceptions
  namespace: kube-system
  labels:
    {{- include "gpu-operator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-5"
spec:
  policyRefs:
    - name: require-run-as-non-root-user
      kind: ValidatingPolicy
    - name: require-run-as-nonroot
      kind: ValidatingPolicy
    - name: disallow-privilege-escalation
      kind: ValidatingPolicy
    - name: disallow-capabilities-strict
      kind: ValidatingPolicy
    - name: restrict-seccomp-strict
      kind: ValidatingPolicy
    - name: disallow-host-path
      kind: ValidatingPolicy
    - name: restrict-volume-types
      kind: ValidatingPolicy
    # check-resources-request-and-limits-ratio is a supplemental policy and
    # usually not enabled. It is excepted because the gpu-operator and Node
    # Feature Discovery workloads fail it when the policy is enforced.
    - name: check-resources-request-and-limits-ratio
      kind: ValidatingPolicy
    # require-container-requests-and-limits is a supplemental policy and usually
    # not enabled. It is excepted because the gpu-operator-upgrade-crd and
    # gpu-operator-cleanup-gpucluster hook Jobs fail it when the policy is
    # enforced.
    - name: require-container-requests-and-limits
      kind: ValidatingPolicy
    # require-pod-probes is a supplemental policy and usually not enabled. It is
    # excepted because the Pods of the gpu-operator hook Jobs fail it when the
    # policy is enforced.
    - name: require-pod-probes
      kind: ValidatingPolicy
    # require-ro-rootfs is a supplemental policy and usually not enabled. It is
    # excepted because the gpu-operator Deployment and hook Jobs fail it when the
    # policy is enforced.
    - name: require-ro-rootfs
      kind: ValidatingPolicy
    # restrict-sa-automount-sa-token is a supplemental policy and usually not
    # enabled. It is excepted because the gpu-operator and Node Feature Discovery
    # ServiceAccounts fail it when the policy is enforced.
    - name: restrict-sa-automount-sa-token
      kind: ValidatingPolicy
  matchConditions:
    # The operator Deployment and its pre-upgrade CRD Job (gpu-operator,
    # gpu-operator-*), and Node Feature Discovery (*node-feature-discovery*).
    # ServiceAccount is matched for restrict-sa-automount-sa-token.
    - name: gpu-operator-workloads
      expression: >-
        request.kind.kind in ['Deployment', 'DaemonSet', 'ReplicaSet', 'Job', 'Pod', 'ServiceAccount'] &&
        request.namespace == '{{ .Release.Namespace }}' &&
        has(object.metadata.name) &&
        (object.metadata.name == 'gpu-operator' ||
        object.metadata.name.startsWith('gpu-operator-') ||
        object.metadata.name.contains('node-feature-discovery'))
---
{{/*
The GPU DaemonSets are not part of this chart: the operator reconciles them from the
ClusterPolicy after install, so they need an exception of their own. They are
privileged by nature, mounting the driver root and the device nodes from the host.
*/}}
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: gpu-operator-components-exceptions
  namespace: kube-system
  labels:
    {{- include "gpu-operator.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": "pre-install,pre-upgrade"
    "helm.sh/hook-weight": "-5"
spec:
  policyRefs:
    - name: require-run-as-non-root-user
      kind: ValidatingPolicy
    - name: require-run-as-nonroot
      kind: ValidatingPolicy
    - name: disallow-privilege-escalation
      kind: ValidatingPolicy
    - name: disallow-privileged-containers
      kind: ValidatingPolicy
    - name: disallow-capabilities-strict
      kind: ValidatingPolicy
    - name: restrict-seccomp-strict
      kind: ValidatingPolicy
    - name: disallow-host-path
      kind: ValidatingPolicy
    - name: disallow-host-namespaces
      kind: ValidatingPolicy
    - name: disallow-host-ports
      kind: ValidatingPolicy
    - name: restrict-volume-types
      kind: ValidatingPolicy
  matchConditions:
    # Created by the operator from the ClusterPolicy (nvidia-*,
    # gpu-feature-discovery*).
    - name: gpu-operator-components
      expression: >-
        request.kind.kind in ['DaemonSet', 'Pod'] &&
        request.namespace == '{{ .Release.Namespace }}' &&
        has(object.metadata.name) &&
        (object.metadata.name.startsWith('nvidia-') ||
        object.metadata.name == 'gpu-feature-discovery' ||
        object.metadata.name.startsWith('gpu-feature-discovery-'))
{{- end }}
